[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lile"
dynamic = ["version"]
description = "lile — LiveLearn local LLM daemon. One mutable model. Always serving. Always trainable."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = ["llm", "online-learning", "fine-tuning", "rlvr", "lora", "unsloth"]
authors = [
    {name = "Heiervang Technologies"},
]
classifiers = [
    "Programming Language :: Python",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "unsloth @ git+https://github.com/heiervang-technologies/ht-unsloth@ht-2026-05-15",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "prometheus-client",
    "safetensors",
    "scipy",
]

[project.optional-dependencies]
eval = [
    "lm-eval>=0.4.0",
    "evalplus>=0.3.0",
]
dev = [
    "jurigged>=0.5.0",
]
test = [
    "pytest",
]

[tool.setuptools.dynamic]
version = {attr = "lile.__version__"}

[tool.setuptools.packages.find]
include = ["lile*"]
exclude = ["lile.tests*"]

[tool.pytest.ini_options]
testpaths = ["lile/tests"]
python_files = ["test_*.py"]
markers = [
    "cpu_only: test runs without a GPU (pure function, queue, trajectory, filesystem)",
    "gpu: test requires CUDA (loads a real model, exercises Unsloth kernels)",
    "eval: test exercises lile.teach.eval harness (stub path without --extra eval)",
]
