[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainfer"
dynamic = ["version"]
description = "trainfer — train and infer at the same time. One mutable model. Always serving. Always trainable."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
keywords = [
    "llm",
    "continual-learning",
    "online-learning",
    "fine-tuning",
    "rlvr",
    "lora",
    "unsloth",
]
authors = [
    {name = "Heiervang Technologies"},
]
classifiers = [
    "Programming Language :: Python",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "unsloth @ git+https://github.com/heiervang-technologies/ht-unsloth@ht-2026-05-15",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "prometheus-client",
    "safetensors",
    "scipy",
]

[project.optional-dependencies]
# ``evalplus`` powers the in-tree HumanEval verifier. The offline eval
# harness itself moved to the ``cont`` repo along with teach/ — install
# ``cont`` if you want lm-eval-shaped benchmark runs.
verifiers = [
    "evalplus>=0.3.0",
]
dev = [
    "jurigged>=0.5.0",
]
test = [
    "pytest",
]

[tool.setuptools.dynamic]
version = {attr = "trainfer.__version__"}

[tool.setuptools.packages.find]
include = ["trainfer*"]
exclude = ["trainfer.tests*"]

[tool.pytest.ini_options]
testpaths = ["trainfer/tests"]
python_files = ["test_*.py"]
markers = [
    "cpu_only: test runs without a GPU (pure function, queue, trajectory, filesystem)",
    "gpu: test requires CUDA (loads a real model, exercises Unsloth kernels)",
]

[tool.pyright]
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
