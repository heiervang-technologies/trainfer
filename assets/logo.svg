<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 220" role="img" aria-labelledby="title desc">
  <title id="title">trainfer</title>
  <desc id="desc">Two continuous opposing arrows forming a shared loop beside the trainfer wordmark.</desc>

  <!--
    Palette (three colors):
      ink       #17233B
      live teal #0AAE9B
      keyline   #F7FAFC
  -->

  <g id="mark" transform="translate(10 10)">
    <!-- Light keylines preserve the silhouette on dark backgrounds. -->
    <path d="M43 106C43 62 67 40 100 40C134 40 157 64 157 99"
          fill="none" stroke="#F7FAFC" stroke-width="34" stroke-linecap="round"/>
    <path d="M157 94H178L153 123L128 94H145"
          fill="#F7FAFC" stroke="#F7FAFC" stroke-width="15" stroke-linejoin="round"/>
    <path d="M157 94C157 138 133 160 100 160C66 160 43 136 43 101"
          fill="none" stroke="#F7FAFC" stroke-width="34" stroke-linecap="round"/>
    <path d="M43 106H22L47 77L72 106H55"
          fill="#F7FAFC" stroke="#F7FAFC" stroke-width="15" stroke-linejoin="round"/>

    <!-- Training and inference move concurrently around one shared loop. -->
    <path d="M43 106C43 62 67 40 100 40C134 40 157 64 157 99"
          fill="none" stroke="#0AAE9B" stroke-width="22" stroke-linecap="round"/>
    <path d="M157 94H178L153 123L128 94H145Z" fill="#0AAE9B"/>
    <path d="M157 94C157 138 133 160 100 160C66 160 43 136 43 101"
          fill="none" stroke="#17233B" stroke-width="22" stroke-linecap="round"/>
    <path d="M43 106H22L47 77L72 106H55Z" fill="#17233B"/>
  </g>

  <!-- The keyline is intentionally part of the wordmark for dark-mode use. -->
  <text x="224" y="146"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="112" font-weight="700" letter-spacing="-5"
        fill="#17233B" stroke="#F7FAFC" stroke-width="8"
        stroke-linejoin="round" paint-order="stroke fill">train<tspan fill="#0AAE9B">fer</tspan></text>
</svg>
