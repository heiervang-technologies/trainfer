name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    # Torchless slice: the conftest whitelist (_TORCHLESS_OK) collects only the
    # files that import without torch/unsloth, so we deliberately skip
    # `pip install -e .` (its unsloth git dependency pulls in torch + CUDA).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install torchless dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" httpx pydantic prometheus-client safetensors scipy pytest
      - name: pytest -m cpu_only
        run: python -m pytest -m cpu_only -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Hard gate on syntax errors and undefined names only; the wider
          # rule set has pre-existing debt tracked separately.
          args: check --select E9,F63,F7,F82 .
